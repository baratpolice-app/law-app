<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>এএসআই পদোন্নতি প্রস্তুতি | কনস্টেবল/নায়েক টু এএসআই (নিরস্ত্র)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#0B3B2E;
    --forest-deep:#062720;
    --forest-line:#194A3B;
    --gold:#C0922F;
    --gold-light:#E3BE71;
    --paper:#F8F4E9;
    --paper-dim:#EFE7D2;
    --ink:#211D14;
    --ink-soft:#6E6552;
    --line:#DED0AC;
    --good:#2F6844;
    --good-bg:#E4EFE6;
    --bad:#A23B3B;
    --bad-bg:#F5E5E2;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Hind Siliguri', 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold-light);}

  /* ---------- App shell ---------- */
  #app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:76px;}

  header.top{
    background:var(--forest);
    color:#EDE7D4;
    padding:20px 48px 18px 20px;
    position:sticky;top:0;z-index:20;
    border-bottom:1px solid var(--gold);
    box-shadow:0 1px 0 rgba(0,0,0,.15);
  }
  header.top .brand{display:flex;align-items:center;gap:14px;}
  header.top .brand > div{min-width:0;}
  header.top .brand svg{flex:0 0 auto;}
  header.top h1{font-family:'Tiro Bangla', serif;font-size:18.5px;font-weight:400;margin:0;line-height:1.35;letter-spacing:.2px;}
  header.top p.sub{margin:3px 0 0;font-size:12px;color:#B9C2AE;font-weight:400;letter-spacing:.15px;}
  header.top .back{
    background:none;border:1px solid rgba(237,231,212,.35);color:#EDE7D4;
    border-radius:var(--radius);padding:6px 12px;font-size:13px;font-family:inherit;
    cursor:pointer;margin-bottom:12px;
  }
  header.top .back:active{background:rgba(237,231,212,.1);}
  .gear-btn{
    position:absolute;top:18px;right:16px;background:none;border:none;
    padding:6px;cursor:pointer;line-height:0;
  }
  .gear-btn:active{opacity:.7;}

  .sync-banner{
    font-size:12.5px;color:var(--ink-soft);background:var(--paper-dim);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;margin-bottom:20px;line-height:1.65;
  }
  .sync-banner a{color:var(--forest);font-weight:600;text-decoration:none;border-bottom:1px solid var(--gold);}

  .field-input{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);
    font-family:'JetBrains Mono',monospace;font-size:12.5px;background:#fff;color:var(--ink);
  }
  .field-input:focus{outline:none;border-color:var(--forest);}
  .field-label{font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .sync-status{font-size:12.5px;margin-top:10px;min-height:16px;line-height:1.6;}

  .sync-card{
    background:#fff;border:1px solid var(--line);border-left:3px solid var(--good);
    border-radius:var(--radius);padding:14px 16px;
  }
  .sync-card-top{display:flex;align-items:center;gap:8px;}
  .sync-card .dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:0 0 auto;}
  .sync-card .label{font-size:14.5px;font-weight:600;color:var(--ink);}
  .sync-card-meta{font-size:12px;color:var(--ink-soft);margin-top:5px;margin-left:16px;}

  .setup-help{margin-top:24px;border-top:1px solid var(--line);padding-top:14px;}
  .setup-help summary{
    font-size:13px;color:var(--forest);font-weight:600;cursor:pointer;
    list-style:none;
  }
  .setup-help summary::-webkit-details-marker{display:none;}
  .setup-help summary::before{content:"▸ ";color:var(--gold);}
  .setup-help[open] summary::before{content:"▾ ";}

  main{padding:20px 20px 8px;}

  /* ---------- Nav bar (bottom) ---------- */
  nav.tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:640px;
    display:flex;background:#fff;border-top:1px solid var(--line);
    z-index:30;
  }
  nav.tabbar button{
    flex:1;background:none;border:none;border-top:2px solid transparent;font-family:inherit;
    padding:10px 4px 8px;font-size:11.5px;color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
    margin-top:-1px;
  }
  nav.tabbar button svg{width:20px;height:20px;}
  nav.tabbar button.active{color:var(--forest);border-top-color:var(--gold);}
  nav.tabbar button.active svg{stroke:var(--gold);}

  /* ---------- Home ---------- */
  .stat-strip{
    display:flex;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    margin:6px 0 24px;overflow:hidden;
  }
  .stat-cell{flex:1;text-align:center;padding:14px 8px;}
  .stat-cell + .stat-cell{border-left:1px solid var(--line);}
  .stat-cell .num{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:500;color:var(--forest);}
  .stat-cell .lbl{font-size:11px;color:var(--ink-soft);margin-top:3px;}

  h2.section-title{
    font-family:'Tiro Bangla',serif;font-weight:400;font-size:17px;
    margin:28px 0 4px;padding-bottom:9px;border-bottom:1px solid var(--gold);
    display:flex;align-items:baseline;justify-content:space-between;
  }
  h2.section-title:first-of-type{margin-top:0;}
  .section-title .count{font-family:'Hind Siliguri';font-size:12px;color:var(--ink-soft);}

  .subject-grid{display:flex;flex-direction:column;}
  .subject-card{
    background:transparent;border:none;border-bottom:1px solid var(--line);
    padding:15px 2px;
    display:flex;align-items:center;gap:14px;
    cursor:pointer;
  }
  .subject-card:active{background:var(--paper-dim);}
  .subject-card .idx{
    flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold);
    border:1px solid var(--gold);border-radius:50%;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
  }
  .subject-card .body{flex:1;min-width:0;}
  .subject-card .name{font-size:15px;font-weight:600;color:var(--ink);}
  .subject-card .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .subject-card .arrow{color:var(--gold);font-size:18px;flex:0 0 auto;}

  .cta-block{
    background:var(--forest);color:#EDE7D4;border-radius:var(--radius);
    padding:20px;margin:22px 0;text-align:left;position:relative;
    border:1px solid var(--forest-line);
  }
  .cta-block h3{font-family:'Tiro Bangla',serif;font-weight:400;font-size:17px;margin:0 0 7px;}
  .cta-block p{font-size:13px;color:#B9C2AE;margin:0 0 15px;line-height:1.65;}
  .btn{
    display:inline-block;background:var(--gold);color:var(--forest-deep);
    font-family:inherit;font-weight:600;font-size:14px;border:none;
    border-radius:var(--radius);padding:11px 20px;cursor:pointer;
  }
  .btn.secondary{background:transparent;color:#EDE7D4;border:1px solid rgba(237,231,212,.4);font-weight:500;}
  .btn.block{display:block;width:100%;text-align:center;}
  .btn:active{opacity:.85;}

  /* ---------- Practice setup ---------- */
  .option-list{display:flex;flex-direction:column;gap:8px;margin:14px 0 20px;}
  .pill-option{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  }
  .pill-option.selected{border-color:var(--forest);background:#EEF3EE;font-weight:600;}

  /* ---------- Quiz ---------- */
  .quiz-meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .quiz-meta .timer{font-family:'JetBrains Mono',monospace;color:var(--forest);font-weight:600;}
  .progress-track{height:3px;background:var(--line);border-radius:0;overflow:hidden;margin-bottom:24px;}
  .progress-fill{height:100%;background:var(--gold);transition:width .25s;}

  .q-tag{
    display:inline-block;font-size:11px;color:var(--forest);background:var(--paper-dim);
    border:1px solid var(--line);padding:3px 10px;border-radius:20px;margin-bottom:12px;font-weight:600;
  }
  .q-text{font-family:'Tiro Bangla',serif;font-size:17px;line-height:1.7;margin:0 0 20px;font-weight:400;}

  .choice{
    display:flex;gap:12px;align-items:flex-start;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:9px;cursor:pointer;font-size:14.5px;line-height:1.55;
  }
  .choice .tag{
    flex:0 0 auto;width:25px;height:25px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink-soft);
    font-family:'Tiro Bangla',serif;
  }
  .choice.correct{background:var(--good-bg);border-color:var(--good);}
  .choice.correct .tag{background:var(--good);border-color:var(--good);color:#fff;}
  .choice.wrong{background:var(--bad-bg);border-color:var(--bad);}
  .choice.wrong .tag{background:var(--bad);border-color:var(--bad);color:#fff;}
  .choice.disabled{cursor:default;}

  .explain{
    background:var(--paper-dim);border-left:3px solid var(--gold);border-radius:0;
    padding:13px 14px;font-size:13.5px;line-height:1.7;color:var(--ink);margin:15px 0 20px;
  }
  .explain b{color:var(--forest);}

  .quiz-actions{display:flex;gap:10px;}
  .quiz-actions .btn{flex:1;}

  /* ---------- Result screen ---------- */
  .result-hero{
    text-align:center;padding:28px 14px 16px;margin-bottom:10px;
    border:1px solid var(--gold);border-radius:var(--radius);background:#fff;
    position:relative;
  }
  .result-hero::before, .result-hero::after{
    content:"";position:absolute;top:6px;bottom:6px;width:1px;background:var(--line);
  }
  .result-hero::before{left:6px;}
  .result-hero::after{right:6px;}
  .result-hero .score{font-family:'JetBrains Mono',monospace;font-size:42px;color:var(--forest);font-weight:500;}
  .result-hero .of{font-size:13.5px;color:var(--ink-soft);margin-top:-4px;}
  .result-hero .verdict{margin-top:12px;font-size:14.5px;font-weight:600;}
  .result-hero .verdict.pass{color:var(--good);}
  .result-hero .verdict.fail{color:var(--bad);}

  .review-item{border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:9px;background:#fff;}
  .review-item .rq{font-size:14px;font-weight:600;margin-bottom:8px;}
  .review-item .ra{font-size:13px;margin-bottom:3px;}
  .review-item .ra.right{color:var(--good);}
  .review-item .ra.wrong{color:var(--bad);text-decoration:line-through;}

  .history-item{
    display:flex;justify-content:space-between;align-items:center;
    background:transparent;border:none;border-bottom:1px solid var(--line);
    padding:13px 2px;margin-bottom:0;
  }
  .history-item .hleft .hsub{font-size:13.5px;font-weight:600;}
  .history-item .hleft .hdate{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .history-item .hscore{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;}
  .history-item .hscore.good{color:var(--good);}
  .history-item .hscore.bad{color:var(--bad);}

  .empty-state{text-align:center;padding:52px 20px;color:var(--ink-soft);}
  .empty-state svg{margin-bottom:12px;opacity:.5;}
  .empty-state p{font-size:13.5px;line-height:1.65;}

  .hidden{display:none !important;}
  @media (min-width:641px){ #app{border-left:1px solid var(--line);border-right:1px solid var(--line);} }
</style>

<body>

<div id="app">

  <header class="top">
    <button class="back hidden" id="backBtn">← ফিরে যান</button>
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14.5" stroke="#D9B65C" stroke-width="1.3"/>
        <circle cx="16" cy="16" r="11.3" stroke="#D9B65C" stroke-width="1"/>
        <path d="M16.0 9.3 L17.53 13.4 L21.9 13.58 L18.47 16.3 L19.64 20.52 L16.0 18.1 L12.36 20.52 L13.53 16.3 L10.1 13.58 L14.47 13.4 Z" fill="#D9B65C"/>
      </svg>
      <div>
        <h1 id="headerTitle">কনস্টেবল/নায়েক → এএসআই (নিরস্ত্র)</h1>
        <p class="sub" id="headerSub">বিভাগীয় পদোন্নতি এমসিকিউ পরীক্ষার প্রস্তুতি</p>
      </div>
    </div>
    <button class="gear-btn" id="settingsBtn" title="অনলাইন সিঙ্ক সেটিংস">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9B65C" stroke-width="1.7">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
      </svg>
    </button>
  </header>

  <main id="mainArea"></main>

  <nav class="tabbar">
    <button data-tab="home" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11L12 4l9 7"/><path d="M5 10v9h14v-9"/></svg>
      হোম
    </button>
    <button data-tab="practice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
      বিষয়ভিত্তিক
    </button>
    <button data-tab="mock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      মক টেস্ট
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M8 12h8M8 16h5"/></svg>
      ফলাফল
    </button>
  </nav>
</div>

<script>
(function(){
"use strict";

/* ===================== QUESTION BANK ===================== */
/* Starter bank — expand by adding objects to QUESTIONS. Each subject id must match SUBJECTS below. */
/* Subjects are now created automatically from whatever "subject" values appear in your
   Google Sheet (see ensureSubjectMeta below) — no hardcoded/offline subjects or demo
   questions ship with the app anymore. */
var SUBJECTS = [];

/* No offline/demo questions ship with the app anymore — everything comes from your
   Google Sheet via sync. */
var LOCAL_QUESTIONS = [];

/* ===================== ONLINE (GOOGLE SHEET) QUESTIONS ===================== */
/* Merges with LOCAL_QUESTIONS above. QUESTIONS is the live, merged bank used everywhere. */
var REMOTE_QUESTIONS = [];
var QUESTIONS = LOCAL_QUESTIONS.slice();

function ensureSubjectMeta(id){
  if(!id) return;
  if(!SUBJECTS.some(function(s){ return s.id===id; })){
    SUBJECTS.push({id:id, name:id, note:"অনলাইন থেকে যুক্ত হয়েছে"});
  }
}
function mergeRemote(remoteQs){
  REMOTE_QUESTIONS = remoteQs;
  remoteQs.forEach(function(q){ ensureSubjectMeta(q.s); });
  QUESTIONS = LOCAL_QUESTIONS.concat(REMOTE_QUESTIONS);
}
function bnDigitsToAscii(s){
  var map = {"০":"0","১":"1","২":"2","৩":"3","৪":"4","৫":"5","৬":"6","৭":"7","৮":"8","৯":"9"};
  return String(s).replace(/[০-৯]/g, function(ch){ return map[ch]; });
}
function normalizeRemoteRow(r){
  var opts = Array.isArray(r.o) ? r.o : [r.option_a, r.option_b, r.option_c, r.option_d];
  var ansRaw = r.a!==undefined ? r.a : r.answer;
  var ansIdx = ansRaw;
  if(typeof ansRaw === "string"){
    var cleaned = bnDigitsToAscii(ansRaw.trim());
    var letters = {"ক":0,"খ":1,"গ":2,"ঘ":3,"a":0,"b":1,"c":2,"d":3,"A":0,"B":1,"C":2,"D":3};
    ansIdx = letters.hasOwnProperty(ansRaw.trim()) ? letters[ansRaw.trim()] : parseInt(cleaned,10);
  }
  return {
    s: String(r.s || r.subject || "অনলাইন প্রশ্ন").trim(),
    q: String(r.q || r.question || "").trim(),
    o: opts.map(function(x){ return x===undefined||x===null ? "" : String(x).trim(); }),
    a: Number(ansIdx),
    e: String(r.e || r.explanation || "").trim()
  };
}
function fetchRemoteQuestions(){
  var url = store.remoteUrl;
  if(!url) return Promise.resolve(false);
  return fetch(url).then(function(res){
    if(!res.ok) throw new Error("HTTP "+res.status);
    return res.json();
  }).then(function(data){
    var raw = data.questions || data || [];
    var qs = raw.map(normalizeRemoteRow).filter(function(q){
      return q.q && q.s && q.o.length===4 && q.o.every(function(x){return x!=="";}) && !isNaN(q.a) && q.a>=0 && q.a<=3;
    });
    mergeRemote(qs);
    store.remoteCache = qs;
    store.remoteUpdated = Date.now();
    saveStore(store);
    return true;
  });
}

/* Auto-sync: re-fetch quietly in the background so the person almost never
   has to tap "সিঙ্ক করুন" by hand. Throttled so it doesn't refetch on every
   single tab switch. */
var AUTO_SYNC_INTERVAL_MS = 3*60*1000;
function maybeAutoSync(){
  if(!store.remoteUrl) return;
  var last = store.remoteUpdated || 0;
  if(Date.now() - last < AUTO_SYNC_INTERVAL_MS) return;
  fetchRemoteQuestions().then(function(){
    if(state.tab!=="settings" && !state.quiz) render();
  }).catch(function(){ /* stay on cached/local data silently */ });
}

/* ===================== STATE & STORAGE ===================== */
var LS_KEY = "asi_promo_prep_v1";
function loadStore(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : {attempts:[]};
  }catch(e){ return {attempts:[]}; }
}
function saveStore(store){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){}
}
var store = loadStore();

var state = {
  tab: "home",
  quiz: null // active quiz session
};

function subjectQuestions(sid){
  return QUESTIONS.filter(function(q){ return q.s === sid; });
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function fmtTime(sec){
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function fmtDate(ts){
  var d = new Date(ts);
  var months=["জানু","ফেব্রু","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্ট","অক্টো","নভে","ডিসে"];
  return d.getDate()+" "+months[d.getMonth()]+", "+d.getFullYear();
}
function subjectStats(sid){
  var atts = store.attempts.filter(function(a){return a.subject===sid && a.mode==="practice";});
  if(!atts.length) return null;
  var last = atts[atts.length-1];
  return {pct: Math.round(100*last.correct/last.total)};
}

/* ===================== RENDER: TABBAR ===================== */
var tabBtns = document.querySelectorAll("nav.tabbar button");
tabBtns.forEach(function(btn){
  btn.addEventListener("click", function(){
    if(state.quiz){

/* ===================== QUIZ ENGINE ===================== */
function startPractice(subjectId){
  var qs = shuffle(subjectQuestions(subjectId));
  var sub = SUBJECTS.filter(function(s){return s.id===subjectId;})[0];
  state.quiz = {
    mode:"practice", subject:subjectId, subjectName: sub?sub.name:"",
    questions: qs, idx:0, answers:[], startedAt: Date.now(),
    timerId:null, timeLeft:null
  };
  document.getElementById("backBtn").classList.remove("hidden");
  renderQuizQuestion();
}
function startMock(count){
  var qs = shuffle(QUESTIONS).slice(0, count);
  var totalSec = Math.round(count*45);
  state.quiz = {
    mode:"mock", subject:null, subjectName:"মিশ্রিত (মক টেস্ট)",
    questions: qs, idx:0, answers:[], startedAt: Date.now(),
    timeLeft: totalSec
  };
  document.getElementById("backBtn").classList.remove("hidden");
  startMockTimer();
  renderQuizQuestion();
}
function startMockTimer(){
  clearInterval(state.quiz.timerId);
  state.quiz.timerId = setInterval(function(){
    if(!state.quiz) return clearInterval(state.quiz&&state.quiz.timerId);
    state.quiz.timeLeft--;
    var t = document.getElementById("quizTimer");
    if(t) t.textContent = fmtTime(Math.max(0,state.quiz.timeLeft));
    if(state.quiz.timeLeft<=0){
      clearInterval(state.quiz.timerId);
      finishQuiz(true);
    }
  },1000);
}

function renderQuizQuestion(){
  var quiz = state.quiz;
  var q = quiz.questions[quiz.idx];
  var already = quiz.answers[quiz.idx];
  setHeader(quiz.subjectName, "প্রশ্ন "+(quiz.idx+1)+" / "+quiz.questions.length, true);

  var subLabel = (SUBJECTS.filter(function(s){return s.id===q.s;})[0]||{}).name || "";

  var html = "";
  html += '<div class="quiz-meta">'+
    '<span>প্রশ্ন '+(quiz.idx+1)+' / '+quiz.questions.length+'</span>'+
    (quiz.mode==="mock" ? '<span class="timer" id="quizTimer">'+fmtTime(Math.max(0,quiz.timeLeft))+'</span>' : '<span></span>')+
  '</div>';
  html += '<div class="progress-track"><div class="progress-fill" style="width:'+Math.round(100*quiz.idx/quiz.questions.length)+'%"></div></div>';
  html += '<div class="q-tag">'+subLabel+'</div>';
  html += '<div class="q-text">'+q.q+'</div>';
  html += '<div id="choicesWrap">';
  q.o.forEach(function(opt, i){
    var cls = "choice";
    var disabled = quiz.mode==="practice" && already!==undefined;
    if(disabled){
      cls += " disabled";
      if(i===q.a) cls += " correct";
      else if(i===already) cls += " wrong";
    }
    html += '<div class="'+cls+'" data-idx="'+i+'"><div class="tag">'+["ক","খ","গ","ঘ"][i]+'</div><div>'+opt+'</div></div>';
  });
  html += '</div>';

  if(quiz.mode==="practice" && already!==undefined){
    html += '<div class="explain"><b>ব্যাখ্যা:</b> '+q.e+'</div>';
  }

  html += '<div class="quiz-actions">';
  if(quiz.mode==="practice"){
    if(already===undefined){
      html += '<button class="btn block" id="skipBtn" style="background:#fff;border:1px solid var(--line);color:var(--ink-soft);">এড়িয়ে যান</button>';
    } else {
      html += '<button class="btn block" id="nextBtn">'+(quiz.idx+1<quiz.questions.length ? "পরবর্তী প্রশ্ন" : "ফলাফল দেখুন")+'</button>';
    }
  } else {
    html += '<button class="btn block" id="nextBtn">'+(quiz.idx+1<quiz.questions.length ? "পরবর্তী প্রশ্ন" : "টেস্ট জমা দিন")+'</button>';
  }
  html += '</div>';

  main.innerHTML = html;

  if(!(quiz.mode==="practice" && already!==undefined)){
    document.querySelectorAll("#choicesWrap .choice").forEach(function(el){
      el.addEventListener("click", function(){
        var i = parseInt(el.getAttribute("data-idx"),10);
        selectAnswer(i);
      });
    });
  }
  var skipBtn = document.getElementById("skipBtn");
  if(skipBtn) skipBtn.addEventListener("click", function(){ advanceQuiz(); });
  var nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", function(){ advanceQuiz(); });
}

function selectAnswer(i){
  var quiz = state.quiz;
  quiz.answers[quiz.idx] = i;
  if(quiz.mode==="practice"){
    renderQuizQuestion();
  } else {
    // mock: just visually mark selection, don't reveal correctness
    document.querySelectorAll("#choicesWrap .choice").forEach(function(el){
      el.classList.remove("selected");
      el.style.borderColor = "";
      el.style.background = "";
    });
    var chosen = document.querySelector('#choicesWrap .choice[data-idx="'+i+'"]');
    if(chosen){ chosen.style.borderColor = "var(--navy)"; chosen.style.background = "#EEF2F6"; }
  }
}

function advanceQuiz(){
  var quiz = state.quiz;
  if(quiz.idx+1 < quiz.questions.length){
    quiz.idx++;
    renderQuizQuestion();
    window.scrollTo(0,0);
  } else {
    finishQuiz(false);
  }
}

function finishQuiz(timedOut){
  var quiz = state.quiz;
  if(quiz.timerId) clearInterval(quiz.timerId);
  var correct = 0;
  quiz.questions.forEach(function(q,i){ if(quiz.answers[i]===q.a) correct++; });
  var attempt = {
    mode: quiz.mode, subject: quiz.subject, subjectName: quiz.subjectName,
    total: quiz.questions.length, correct: correct, ts: Date.now(),
    questions: quiz.questions.map(function(q,i){ return {q:q.q, o:q.o, a:q.a, chosen: quiz.answers[i], e:q.e}; })
  };
  store.attempts.push(attempt);
  if(store.attempts.length>50) store.attempts = store.attempts.slice(-50);
  saveStore(store);
  state.quiz = null;
  renderResultDetail(attempt, timedOut);
}

/* ===================== RENDER: RESULT DETAIL ===================== */
function renderResultDetail(attempt, timedOut){
  setHeader(attempt.subjectName, "ফলাফল", true);
  var pct = Math.round(100*attempt.correct/attempt.total);
  var pass = pct>=60;
  var html = "";
  html += '<div class="result-hero">'+
    '<div class="score">'+attempt.correct+'/'+attempt.total+'</div>'+
    '<div class="of">সঠিক উত্তর ('+pct+'%)'+(timedOut?" · সময় শেষ":"")+'</div>'+
    '<div class="verdict '+(pass?"pass":"fail")+'">'+(pass?"ভালো প্রস্তুতি! এই ধারা বজায় রাখুন।":"আরও অনুশীলন প্রয়োজন — দুর্বল অংশ চিহ্নিত করে আবার চেষ্টা করুন।")+'</div>'+
  '</div>';
  html += '<button class="btn block" id="retryBtn" style="margin-bottom:10px;">আবার অনুশীলন করুন</button>';
  html += '<button class="btn block" id="homeFromResultBtn" style="background:#fff;border:1px solid var(--line);color:var(--ink);margin-bottom:22px;">হোমে ফিরুন</button>';

  html += '<h2 class="section-title">উত্তরপত্র পর্যালোচনা</h2>';
  attempt.questions.forEach(function(item, i){
    var wasRight = item.chosen===item.a;
    html += '<div class="review-item">'+
      '<div class="rq">'+(i+1)+'. '+item.q+'</div>';
    if(item.chosen!==undefined && !wasRight){
      html += '<div class="ra wrong">আপনার উত্তর: '+["ক","খ","গ","ঘ"][item.chosen]+'. '+item.o[item.chosen]+'</div>';
    } else if(item.chosen===undefined){
      html += '<div class="ra wrong">উত্তর দেওয়া হয়নি</div>';
    }
    html += '<div class="ra right">সঠিক উত্তর: '+["ক","খ","গ","ঘ"][item.a]+'. '+item.o[item.a]+'</div>';
    html += '<div style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6;">'+item.e+'</div>';
    html += '</div>';
  });

  main.innerHTML = html;
  document.getElementById("retryBtn").addEventListener("click", function(){
    if(attempt.mode==="practice") startPractice(attempt.subject);
    else startMock(attempt.total);
  });
  document.getElementById("homeFromResultBtn").addEventListener("click", function(){ setTab("home"); });
}

    html += '<button class="btn block" id="syncNowBtn" style="margin-top:14px;">এখনই সিঙ্ক করুন</button>';
    html += '<button class="btn block" id="changeLinkBtn" style="margin-top:10px;background:#fff;border:1px solid var(--line);color:var(--ink);">লিংক পরিবর্তন করুন</button>';
    html += '<button class="btn block" id="disconnectBtn" style="margin-top:10px;background:#fff;border:1px solid var(--line);color:var(--bad);">সংযোগ বিচ্ছিন্ন করুন</button>';
  } else {
    html += '<p style="font-size:13.5px;line-height:1.75;color:var(--ink-soft);margin-top:0;">'+
      'Google Sheet-কে Apps Script দিয়ে Web App হিসেবে পাবলিশ করে সেই লিংকটি নিচে বসান।'+
    '</p>';
  }

  html += '<div id="urlFieldWrap"'+(connected?' class="hidden"':'')+'>';
  html += '<label class="field-label" style="margin-top:14px;">Web App URL</label>';
  html += '<input type="url" id="remoteUrlInput" class="field-input" placeholder="https://script.google.com/macros/s/xxxx/exec" value="'+(store.remoteUrl?escapeAttr(store.remoteUrl):'')+'">';
  html += '<button class="btn block" id="saveUrlBtn" style="margin-top:12px;">সংযুক্ত করে সিঙ্ক করুন</button>';
  html += '</div>';

  html += '<div id="syncStatus" class="sync-status"></div>';

  html += '<details class="setup-help"'+(connected?'':' open')+'>'+
    '<summary>সেটআপ নির্দেশনা ও কোড দেখুন</summary>'+
    '<div class="explain" style="font-size:13px;margin-top:12px;">'+
      '১. একটি Google Sheet খুলুন এবং শিটের নাম দিন <b>Questions</b>।<br>'+
      '২. প্রথম সারিতে কলাম হেডার দিন: <b>subject, question, option_a, option_b, option_c, option_d, answer, explanation</b> (answer কলামে ০, ১, ২ বা ৩ — অথবা ক/খ/গ/ঘ লিখুন)।<br>'+
      '৩. Extensions → Apps Script খুলুন, নিচের কোডটি পেস্ট করুন, তারপর Deploy → New deployment → Web app (Execute as: Me, Who has access: Anyone) করুন।<br>'+
      '৪. যে .../exec লিংকটি পাবেন সেটি উপরে বসিয়ে সংযুক্ত করুন।'+
    '</div>'+
    '<label class="field-label" style="margin-top:14px;">Apps Script কোড (কপি করে পেস্ট করুন)</label>'+
    '<textarea readonly class="field-input" style="height:170px;resize:vertical;white-space:pre;overflow:auto;" onclick="this.select()">'+
      'function doGet(e) {\n'+
      '  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("Questions");\n'+
      '  var data = sheet.getDataRange().getValues();\n'+
      '  var headers = data[0];\n'+
      '  var rows = data.slice(1);\n'+
      '  var questions = rows.filter(function(r){ return r[0] !== ""; }).map(function(r){\n'+
      '    var obj = {};\n'+
      '    headers.forEach(function(h, i){ obj[h] = r[i]; });\n'+
      '    return {\n'+
      '      s: obj.subject, q: obj.question,\n'+
      '      o: [obj.option_a, obj.option_b, obj.option_c, obj.option_d],\n'+
      '      a: obj.answer, e: obj.explanation\n'+
      '    };\n'+
      '  });\n'+
      '  return ContentService.createTextOutput(JSON.stringify({questions: questions}))\n'+
      '    .setMimeType(ContentService.MimeType.JSON);\n'+
      '}'+
    '</textarea>'+
  '</details>';

  main.innerHTML = html;

  var changeLinkBtn = document.getElementById("changeLinkBtn");
  if(changeLinkBtn) changeLinkBtn.addEventListener("click", function(){
    document.getElementById("urlFieldWrap").classList.remove("hidden");
    changeLinkBtn.classList.add("hidden");
  });

  document.getElementById("saveUrlBtn").addEventListener("click", function(){
    var val = document.getElementById("remoteUrlInput").value.trim();
    if(!val){ showSyncStatus("একটি সঠিক URL দিন।", true); return; }
    store.remoteUrl = val;
    saveStore(store);
    showSyncStatus("সিঙ্ক করা হচ্ছে...", false);
    fetchRemoteQuestions().then(function(){
      showSyncStatus("সফলভাবে সিঙ্ক হয়েছে — মোট "+REMOTE_QUESTIONS.length+"টি অনলাইন প্রশ্ন পাওয়া গেছে।", false);
      renderSettings();
    }).catch(function(err){
      showSyncStatus("সিঙ্ক ব্যর্থ হয়েছে। লিংক ও Deploy সেটিংস (Anyone has access) যাচাই করুন। ("+err.message+")", true);
    });
  });
  var syncNowBtn = document.getElementById("syncNowBtn");
  if(syncNowBtn) syncNowBtn.addEventListener("click", function(){
    showSyncStatus("সিঙ্ক করা হচ্ছে...", false);
    fetchRemoteQuestions().then(function(){
      showSyncStatus("সফলভাবে সিঙ্ক হয়েছে — মোট "+REMOTE_QUESTIONS.length+"টি অনলাইন প্রশ্ন পাওয়া গেছে।", false);
      renderSettings();
    }).catch(function(err){
      showSyncStatus("সিঙ্ক ব্যর্থ হয়েছে। ("+err.message+")", true);
    });
  });
  var disconnectBtn = document.getElementById("disconnectBtn");
  if(disconnectBtn) disconnectBtn.addEventListener("click", function(){
    if(!confirm("সংযোগ বিচ্ছিন্ন করলে অনলাইন প্রশ্নগুলো আর দেখা যাবে না। নিশ্চিত?")) return;
    delete store.remoteUrl;
    delete store.remoteCache;
    delete store.remoteUpdated;
    saveStore(store);
    REMOTE_QUESTIONS = [];
    QUESTIONS = LOCAL_QUESTIONS.slice();
    renderSettings();
  });
}

/* ===================== ROUTER ===================== */
function render(){
  if(state.tab==="home") renderHome();
  else if(state.tab==="practice") renderPracticeList();
  else if(state.tab==="mock") renderMockSetup();
  else if(state.tab==="history") renderHistory();
  else if(state.tab==="settings") renderSettings();
}

/* Apply any cached online questions immediately (works offline), then refresh in the background */
if(store.remoteCache && store.remoteCache.length){
  mergeRemote(store.remoteCache);
}
render();
if(store.remoteUrl){
  fetchRemoteQuestions().then(function(){
    if(!state.quiz) render();
  }).catch(function(){ /* offline or misconfigured — cached data (if any) already applied */ });
}

})();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
</script>
</body>
</html>
